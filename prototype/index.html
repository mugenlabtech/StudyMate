<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2455da"><title>StudyMate — Interactive Prototype</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#15233d;background:#f5f7fc}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #f5a623;outline-offset:2px}.skip{position:absolute;left:-9999px}.skip:focus{left:8px;top:8px;z-index:10;background:white;padding:12px}.shell{display:flex;min-height:100vh}.side{width:240px;background:#fff;border-right:1px solid #e5eaf5;padding:24px;position:sticky;top:0;height:100vh}.logo{font-weight:850;font-size:25px;color:#2455da;letter-spacing:-1px}.tag{font-size:12px;color:#65748c}.nav{display:grid;gap:5px;margin-top:28px}.nav button,.bottom button{border:0;background:transparent;color:#50627e;text-align:left;padding:12px;border-radius:12px}.nav button.active,.bottom button.active{background:#eaf0ff;color:#2455da;font-weight:750}.content{max-width:1080px;margin:0 auto;padding:28px 26px 110px;width:100%}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.pill{border:1px solid #dce4f5;border-radius:30px;padding:8px 12px;background:white;font-size:12px}.hero{background:linear-gradient(115deg,#2455da,#18328d);border-radius:20px;color:white;padding:26px;margin:24px 0}.hero p{color:#dce7ff}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card{background:white;border:1px solid #e6ebf5;border-radius:16px;padding:19px;min-width:0}.card h3{margin:0 0 8px}.card p{color:#65748c;font-size:14px;line-height:1.5}.metric{font-size:27px;font-weight:800;color:#2455da}.btn{border:0;border-radius:10px;background:#2455da;color:white;padding:12px 16px;font-weight:650}.secondary{background:#edf2ff;color:#2455da}.muted{color:#65748c}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.stack{display:grid;gap:12px}.field{display:grid;gap:6px;font-size:13px;font-weight:650}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #cdd7e9;border-radius:10px;background:white;color:#15233d}.span2{grid-column:span 2}.bottom{display:none}.toast{position:fixed;right:18px;bottom:20px;background:#172a50;color:white;padding:14px;border-radius:12px;max-width:330px;z-index:5}.eyebrow{font-size:12px;color:#2455da;text-transform:uppercase;letter-spacing:1px;font-weight:800}.badge{background:#fff4d8;color:#7a5100;border-radius:10px;padding:5px 9px;font-size:11px}.list{display:grid;gap:9px}.item{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid #e8edf6;border-radius:12px;padding:12px}.hidden{display:none!important}@media(max-width:800px){.side{display:none}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e5eaf5;justify-content:space-around;padding:8px 3px calc(8px + env(safe-area-inset-bottom));z-index:4}.bottom button{text-align:center;font-size:11px;padding:10px 5px}.content{padding:19px 15px 105px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.span2{grid-column:span 2}.hero{padding:22px}}@media(max-width:390px){.grid{grid-template-columns:1fr}.span2{grid-column:span 1}.top{align-items:flex-start}.pill{font-size:10px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}body.dark{background:#101827;color:#edf2ff}body.dark .card,body.dark .side,body.dark .bottom,body.dark .pill{background:#1b2941;color:#edf2ff;border-color:#344460}body.dark .card p{color:#bdc8da}body.dark .field input,body.dark .field select,body.dark .field textarea{background:#24344e;color:white;border-color:#50627e}body.contrast{filter:contrast(1.3)}</style></head><body><a href="#main" class="skip">Skip to main content</a><div class="shell"><aside class="side"><div class="logo">✦ StudyMate</div><div class="tag">Your Smart Study Partner</div><nav class="nav" id="sidebar" aria-label="Main navigation"></nav><p class="tag">INTERACTIVE DESIGN PROTOTYPE<br>Local demo data only. No cloud AI or billing.</p></aside><main class="content" id="main" tabindex="-1"><header class="top"><div><div class="eyebrow">Student workspace</div><h1 id="heading">Dashboard</h1></div><span class="pill" id="network">● Checking network</span></header><div id="view" aria-live="polite"></div></main></div><nav class="bottom" id="bottom" aria-label="Mobile navigation"></nav><div id="toast" class="toast hidden" role="status"></div><script>
const nav=['Home','Courses','Studio','Practice','More'];const all=['Home','Courses','Studio','Practice','More','Tutor','Planner','Groups','Library','Analytics','Billing','Settings','Admin','Assignments'];let page='Home',course='DEN 201',notes=JSON.parse(localStorage.getItem('sm-notes')||'{}'),courses=JSON.parse(localStorage.getItem('sm-courses')||'["DEN 201","ANA 201","PHS 203"]'),tasks=JSON.parse(localStorage.getItem('sm-tasks')||'[]'),cards=[['What is enamel?','The mineralized outer layer of the tooth crown.'],['What is dentine?','The hard tissue beneath enamel and cementum.']];let flip=false,idx=0;function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function btn(label,action,cls=''){return `<button class="btn ${cls}" onclick="${action}">${label}</button>`}function show(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(window.tm);window.tm=setTimeout(()=>t.classList.add('hidden'),3500)}function setPage(p){page=p;history.pushState({p},'', '#'+encodeURIComponent(p));render()}onpopstate=()=>{page=decodeURIComponent(location.hash.slice(1))||'Home';render()};function selectCourse(c){course=c;setPage('Courses')}function renderNav(){for(const [id,items] of [['sidebar',all],['bottom',nav]])document.getElementById(id).innerHTML=items.map(n=>`<button class="${page===n?'active':''}" aria-current="${page===n?'page':'false'}" onclick="setPage('${n}')">${({Home:'⌂ ',Courses:'▤ ',Studio:'◉ ',Practice:'✓ ',More:'☷ '})[n]||'› '}${n}</button>`).join('')}
function render(){renderNav();document.getElementById('heading').textContent=page;let h='';switch(page){case 'Home':h=`<section class="hero"><span class="badge">DEMO WORKSPACE</span><h2>Good to have you back 👋</h2><p>Your courses, notes and revision tools in one place. Try the prototype flows below.</p>${btn('Open my courses',"setPage('Courses')",'secondary')} ${btn('Lecture studio',"setPage('Studio')",'secondary')}</section><div class="grid"><div class="card"><div class="metric">${courses.length}</div><p>Saved courses</p></div><div class="card"><div class="metric">${Object.keys(notes).length}</div><p>Locally saved notes</p></div><div class="card"><div class="metric">${tasks.length}</div><p>Study tasks</p></div><div class="card span2"><h3>Continue learning</h3><p>${esc(course)} · Your course workspace</p>${btn('Continue',"setPage('Courses')")}</div><div class="card"><h3>Next action</h3><p>Review your flashcards.</p>${btn('Practice',"setPage('Practice')")}</div></div>`;break;
case 'Courses':h=`<section class="hero"><h2>My courses</h2><p>Each course is a home for learning materials and study activities.</p></section><div class="grid">${courses.map(c=>`<div class="card"><h3>${esc(c)}</h3><p>${c===course?'Selected workspace':'Course workspace'}</p>${btn('Open course',`selectCourse('${esc(c)}')`,'secondary')}</div>`).join('')}<div class="card"><h3>Add course</h3><form onsubmit="event.preventDefault();let c=this.elements.code.value.trim().toUpperCase();if(!c)return;if(!courses.includes(c))courses.push(c);localStorage.setItem('sm-courses',JSON.stringify(courses));course=c;render();show('Course added locally')"><label class="field">Course code<input name="code" placeholder="e.g. BCH 201" required maxlength="30"></label><p></p><button class="btn">Add course</button></form></div></div><section class="card" style="margin-top:15px"><div class="eyebrow">Current course</div><h2>${esc(course)}</h2><div class="row">${btn('Write notes',"setPage('Studio')")}${btn('Ask tutor',"setPage('Tutor')",'secondary')}${btn('Flashcards',"setPage('Practice')",'secondary')}${btn('Study plan',"setPage('Planner')",'secondary')}</div></section>`;break;
case 'Studio':h=`<section class="hero"><h2>Learning studio</h2><p>Selected course: ${esc(course)}. Draft notes are saved only in this browser.</p></section><div class="grid"><div class="card span2"><h3>Course notes</h3><label class="field">Edit your notes<textarea id="note" rows="9" placeholder="Type or paste notes here...">${esc(notes[course]||'')}</textarea></label><p></p>${btn('Save note',"saveNote()")}</div><div class="card"><h3>Lecture recording</h3><p>Microphone recording works only where your browser supports it. Audio remains local in this prototype.</p><div class="row">${btn('Start',"startRecording()")}${btn('Stop',"stopRecording()",'secondary')}</div><p id="recstate" role="status">Not recording</p><audio id="playback" controls class="hidden" style="max-width:100%"></audio></div><div class="card"><h3>Document intelligence</h3><label class="field">Choose a document<input type="file" accept=".pdf,.docx,.pptx,.txt,image/*" onchange="show('File selected locally. Extraction requires the backend integration.')"></label><p>OCR and AI processing are not connected in this prototype.</p></div><div class="card"><h3>Visual learning</h3><p>Diagrams, narrated overviews and template-rendered videos will be generated by validated server jobs.</p>${btn('View production requirements',"setPage('More')",'secondary')}</div></div>`;break;
case 'Practice':h=`<section class="hero"><h2>Practice ${esc(course)}</h2><p>Sample cards are explicitly demo-only, not generated from your notes.</p></section><div class="grid"><div class="card span2"><div class="eyebrow">Flashcard ${idx+1} of ${cards.length}</div><h2>${esc(cards[idx][flip?1:0])}</h2><div class="row">${btn('Flip card',"flip=!flip;render()")}${btn('Next card',"idx=(idx+1)%cards.length;flip=false;render()",'secondary')}</div></div><div class="card"><h3>Mini CBT</h3><p>What is the outermost mineralized tissue of the tooth crown?</p><div class="stack">${['Enamel','Dentine','Pulp'].map((x,i)=>btn(x,`show('${i===0?'Correct — enamel is the outer layer.':'Not quite. The answer is enamel.'}')`,'secondary')).join('')}</div><p class="tag">Demonstration question, not verified past paper.</p></div><div class="card"><h3>Adaptive revision</h3><p>Production mastery estimates require stored, course-linked assessment attempts.</p>${btn('Study planner',"setPage('Planner')",'secondary')}</div></div>`;break;
case 'Tutor':h=`<section class="hero"><h2>Course-aware tutor</h2><p>Answers must cite authorized source passages. No fabricated AI responses are shown here.</p></section><div class="card"><label class="field">Question about ${esc(course)}<textarea id="question" rows="4" placeholder="Ask about your uploaded course materials..."></textarea></label><p></p>${btn('Ask grounded tutor',"show('Tutor requires configured server retrieval and model providers. No answer was generated.')")}</div>`;break;
case 'Planner':h=`<section class="hero"><h2>Study planner</h2><p>Create a task linked to ${esc(course)}.</p></section><div class="card"><form onsubmit="event.preventDefault();let v=this.elements.task.value.trim();if(v){tasks.push({course,text:v,done:false});localStorage.setItem('sm-tasks',JSON.stringify(tasks));render()}"><label class="field">New task<input name="task" required placeholder="Revise lecture 2"></label><p></p><button class="btn">Add task</button></form><div class="list" style="margin-top:15px">${tasks.map((t,i)=>`<div class="item"><span>${t.done?'✓ ':''}${esc(t.course)} — ${esc(t.text)}</span>${btn(t.done?'Undo':'Complete',`tasks[${i}].done=!tasks[${i}].done;localStorage.setItem('sm-tasks',JSON.stringify(tasks));render()`,'secondary')}</div>`).join('')}</div></div>`;break;
case 'Settings':h=`<section class="card"><h2>Accessibility preferences</h2><div class="row">${btn('Toggle dark mode',"document.body.classList.toggle('dark')",'secondary')}${btn('High contrast',"document.body.classList.toggle('contrast')",'secondary')}${btn('Larger text',"document.documentElement.style.fontSize='19px'",'secondary')}</div><p>Local prototype settings; production preferences will synchronize securely.</p></section>`;break;
case 'More':h=`<section class="hero"><h2>Explore StudyMate</h2><p>All 24 modules are required for V1.0. These screens communicate scope, not finished integrations.</p></section><div class="grid">${all.slice(5).map(x=>`<div class="card"><h3>${x}</h3><p>${x==='Billing'?'Paystack integration pending.':'Production workflow pending.'}</p>${btn('Explore',`setPage('${x}')`,'secondary')}</div>`).join('')}</div>`;break;
default:h=`<section class="hero"><h2>${esc(page)}</h2><p>Planned first-release module. This prototype does not claim that its server-side workflow exists.</p></section><div class="card"><p>See the implementation matrix and architecture package for acceptance criteria, permissions and dependencies.</p>${btn('Back to overview',"setPage('More')",'secondary')}</div>`}document.getElementById('view').innerHTML=h;document.title=`${page} · StudyMate`}
function saveNote(){notes[course]=document.getElementById('note').value;localStorage.setItem('sm-notes',JSON.stringify(notes));show('Note saved locally on this device')};let recorder,chunks=[];async function startRecording(){if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)return show('Recording not supported in this browser');try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{const blob=new Blob(chunks,{type:recorder.mimeType});const audio=document.getElementById('playback');if(audio){audio.src=URL.createObjectURL(blob);audio.classList.remove('hidden')}stream.getTracks().forEach(t=>t.stop());show('Recording stopped. Local playback only; not uploaded or processed.')};recorder.start(1000);document.getElementById('recstate').textContent='● Recording — keep this page open'}catch(e){show('Microphone unavailable or permission denied')}}function stopRecording(){if(recorder?.state==='recording')recorder.stop();else show('No recording in progress')}function net(){document.getElementById('network').textContent=navigator.onLine?'● Online':'● Offline — local features only'}addEventListener('online',net);addEventListener('offline',net);net();page=decodeURIComponent(location.hash.slice(1))||'Home';render();</script></body></html>
